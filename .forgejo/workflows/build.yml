on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: services.wheresalice.info
    container:
      image: quay.io/buildah/stable:latest
    env:
      STORAGE_DRIVER: vfs
      BUILDAH_ISOLATION: chroot
    steps:
      - name: Install Node (needed by the checkout action)
        run: dnf install -y nodejs

      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Build
        run: buildah build --pull=always -t quay.io/wheresalice/go-away:latest .

      - name: Log in to Quay
        run: echo "${{ secrets.QUAY_PASSWORD }}" | docker login quay.io -u "${{ secrets.QUAY_USERNAME }}" --password-stdin

      - name: Build and push
        run: |
          buildah push quay.io/wheresalice/go-away:latest
