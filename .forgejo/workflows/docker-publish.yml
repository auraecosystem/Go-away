name: Docker-Image-Build
on:
  push:
    branches:
    - main
jobs:
  bake:
    runs-on: codeberg-tiny
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v6
      - name: Setup Docker
        uses: https://github.com/docker/setup-docker-action@v5

      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@v4

      - name: Login to Quay
        uses: https://github.com/docker/login-action@v4
        with:
          registry: quay.io
          username: wheresalice
          password: ${{ secrets.QUAY_SECRET }}

      - name: Build and push
        uses: https://github.com/docker/bake-action@v7
        with:
          source: .
          push: true
          set: |
            *.tags=quay.io/wheresalice/go-away:latest
