<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12"><!--v2-->
	<defs>
		<mask id="radioactive" mask-type="alpha">
			<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" viewBox="-3 -3 6 6">
				<defs>
					<mask id="c" maskUnits="userSpaceOnUse" x="-3" y="-3" width="6" height="6">
						<circle r="1.625" fill="none" stroke="#fff" stroke-width="1.75"/>
					</mask>
				</defs>
				<circle r=".5"/>
				<g mask="url(#c)">
					<g id="a">
						<path id="b" transform="rotate(30)" d="m0 0v2.88h3"/>
						<use transform="scale(-1,1)" xlink:href="#b"/>
					</g>
					<use transform="rotate(120)" xlink:href="#a"/>
					<use transform="rotate(240)" xlink:href="#a"/>
				</g>
			</svg>
		</mask>
		<image id="img" href="data:image/png;base64," width="90" height="90"/>
	</defs><!--tried lots of things with all 3 animation tags, css and patterns;this is still the lightest option-->
	<g mask="url(#radioactive)">
		<use href="#img">
			<animateMotion path="M 0 0 0 90" repeatCount="indefinite" calcMode="linear" dur="3.14159s"/>
		</use>
		<use href="#img">
			<animateMotion path="M 0 -90 0 0" repeatCount="indefinite" calcMode="linear" dur="3.14159s"/>
		</use>
	</g>
</svg>
